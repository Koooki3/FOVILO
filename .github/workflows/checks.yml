name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright-core install --with-deps chromium --no-shell
      - run: npm run test:browser
      - run: python3 scripts/package_chromium.py
